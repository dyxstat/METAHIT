name: METAHICT Nextflow Smoke Test

on:
  push:
    paths:
      - ".github/workflows/metahict-smoke.yml"
      - "README.md"
      - "docs/**"
      - "example_dataset/**"
      - "metahict"
      - "metahict_manager.py"
      - "modules/**"
      - "installation/**"
      - "nextflow/**"
      - "packaging/**"
  pull_request:
    paths:
      - ".github/workflows/metahict-smoke.yml"
      - "README.md"
      - "docs/**"
      - "example_dataset/**"
      - "metahict"
      - "metahict_manager.py"
      - "modules/**"
      - "installation/**"
      - "nextflow/**"
      - "packaging/**"

jobs:
  policy-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enforce vendoring, architecture, and documentation policies
        run: |
          python3 nextflow/ci/check_no_vendored_tools.py
          python3 nextflow/ci/check_architecture_policy.py
          python3 nextflow/ci/check_documentation.py
          python3 nextflow/ci/check_example_dataset.py

      - name: Test third-party integration adapters
        run: |
          python3 -m unittest nextflow/ci/test_binning_refiner_adapter.py
          python3 -m unittest nextflow/ci/test_manager_cli.py
          python3 -m unittest nextflow/ci/test_stage_interfaces.py
          python3 -m unittest nextflow/ci/test_scientific_comparison.py

      - name: Validate shell and Python syntax
        run: |
          sh -n metahict
          find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for path in Path('.').rglob('*.py'):
              ast.parse(path.read_text(), filename=str(path))
          PY

      - name: Verify immutable environment-lock checksums
        working-directory: installation/locks
        run: sha256sum -c SHA256SUMS

  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Use bundled Nextflow launcher
        run: |
          chmod +x nextflow/bin/nextflow
          echo "$PWD/nextflow/bin" >> "$GITHUB_PATH"

      - name: Run DSL2 stub smoke test
        run: python3 metahict_manager.py test workflow
