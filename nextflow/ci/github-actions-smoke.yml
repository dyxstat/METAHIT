name: METAHICT Nextflow Smoke Test

on:
  push:
    paths:
      - "nextflow/**"
  pull_request:
    paths:
      - "nextflow/**"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Use bundled Nextflow launcher
        run: |
          chmod +x nextflow/bin/nextflow
          echo "$PWD/nextflow/bin" >> "$GITHUB_PATH"

      - name: Run DSL2 stub smoke test
        run: |
          mkdir -p "$PWD/nextflow/test_runs/ci_smoke/dummy_db/checkm_db"
          mkdir -p "$PWD/nextflow/test_runs/ci_smoke/dummy_db/gtdbtk_db"
          mkdir -p "$PWD/nextflow/test_runs/ci_smoke/dummy_db/genomad_db"
          touch "$PWD/nextflow/test_runs/ci_smoke/dummy_db/checkm2.dmnd"
          cat > "$PWD/nextflow/test_runs/ci_smoke/ci_resources.config" <<'EOF'
          process {
            withName: '.*' {
              cpus = 2
              memory = '4 GB'
            }
          }
          EOF
          nextflow run nextflow/main_dsl2.nf \
            -profile local \
            -c "$PWD/nextflow/test_runs/ci_smoke/ci_resources.config" \
            --samplesheet nextflow/assets/example_data_samplesheet.csv \
            --out_root "$PWD/nextflow/test_runs/ci_smoke/results" \
            --report_dir "$PWD/nextflow/reports/ci_smoke" \
            -work-dir "$PWD/nextflow/work/ci_smoke" \
            --checkm_db "$PWD/nextflow/test_runs/ci_smoke/dummy_db/checkm_db" \
            --checkm2_db "$PWD/nextflow/test_runs/ci_smoke/dummy_db/checkm2.dmnd" \
            --gtdbtk_db "$PWD/nextflow/test_runs/ci_smoke/dummy_db/gtdbtk_db" \
            --genomad_db "$PWD/nextflow/test_runs/ci_smoke/dummy_db/genomad_db" \
            --threads 2 \
            --clean true \
            --chain true \
            -stub-run \
            -ansi-log false
          python3 nextflow/bin/check_expected_outputs.py \
            --root "$PWD/nextflow/test_runs/ci_smoke/results" \
            --manifest nextflow/tests/expected/native_dsl2_stub_outputs.tsv
