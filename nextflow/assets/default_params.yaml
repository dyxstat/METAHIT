# Human-readable reference of METAHICT module defaults for the native Nextflow
# workflow. Required sample inputs and output paths are supplied by the sample
# sheet and Nextflow command-line parameters. The module scripts remain the
# runtime authority for their defaults; see ../REPRODUCIBILITY.md.

modules:
  preprocessing_sg:
    dedup: false
    prefix: null
    minlen: 50
    trimq: 10
    qtrim: r
    ftl: 10
    xmx: null
    ftm: 5
    ktrim: r
    k: 23
    mink: 11
    hdist: 1
    adapter_ref: null
    skip_pre_qc_report: false
    skip_post_qc_report: false

  preprocessing_hic:
    dedup: true
    prefix: null
    minlen: 50
    trimq: 10
    qtrim: r
    ftl: 10
    xmx: null
    ftm: 5
    ktrim: r
    k: 23
    mink: 11
    hdist: 1
    adapter_ref: null
    skip_pre_qc_report: false
    skip_post_qc_report: false

  assembly:
    assembler: megahit
    memory: null
    min_len: 1000
    k_min: 21
    k_max: 141
    k_step: 12
    merge_level: "20,0.95"
    k_list: "21,33,55"
    flye_method: "--nano-raw"
    tmp_dir: null
    skip_quast: false
    keep_temp: false

  alignment:
    samtools_filter: "-F 0x900"
    bwa_options: "-5SP"
    mapq: 30
    min_intra_dist: 10000
    min_match_len: 30
    sort_memory: 1G
    tmp_dir: null
    keep_sam: false
    skip_metrics: false

  coverage:
    memory: null
    percent_identity: 97
    min_mapq: 0
    weight_mapq: 0
    include_edge_bases: false
    max_edge_bases: 75
    min_contig_length: 0
    min_contig_depth: 0
    bbmap_extra_args: ""
    tmp_dir: null
    keep_sam: false
    keep_temp: false

  contact:
    method: normcc
    metacc_min_signal: 1
    metacc_min_len: 1000
    metacc_min_mapq: 30
    metacc_min_match: 30
    spurious_contact_percent: 5
    coverage_file: null
    epsilon: 1
    max_iter: 1000
    tol: 1e-6

  binning:
    checkm_db: null
    metacc_min_len: 1000
    metacc_min_signal: 2
    metacc_min_mapq: 30
    metacc_min_match: 30
    metacc_min_binsize: 150000
    normcc_thres: 0.05
    bin3c_min_len: 1000
    bin3c_min_signal: 5
    bin3c_min_mapq: 60
    bin3c_min_match: 10
    bin3c_min_extent: 50000
    min_completeness: 50
    max_contamination: 10
    contamination_penalty: 5
    min_input_bin_size: 50000
    max_input_bin_size: 20000000
    binning_refiner_min_size: 524288
    tmp_dir: null
    keep_temp: false
    no_fasta: false
    no_report: false
    no_spades: true
    only_large: false
    skip_checkm2: false
    skip_refinement: false
    skip_consolidation: false
    keep_ambiguous: false
    remove_ambiguous: false
    seed: null

  reassembly:
    memory: null
    cutoff_quantile: 0.95
    top_k: 100
    min_mapq: 30
    min_match_len: 30
    exclude_duplicates: false
    write_nonselected_hic: false
    min_contig_len: 500
    strict_cut_off: 2
    permissive_cut_off: 5
    contamination_penalty: 5
    skip_checkm2: false
    checkm2_db: null
    tmp_dir: null
    spades_mode: careful
    spades_phred_offset: null
    spades_extra_args: ""
    skip_residual_assembly: false
    keep_temp: false

  annotation:
    pplacer_cpus: null
    gtdbtk_db: null
    extension: fa
    prefix: gtdbtk
    skip_ani_screen: true
    mash_db: null
    min_perc_aa: 10
    min_af: 0.5
    full_tree: false
    scratch_dir: null
    tmp_dir: null
    force: false
    keep_intermediates: false
    debug: false
    write_single_copy_genes: false
    gtdbtk_extra_args: ""

  scaffolding:
    memory: null
    resolution: 10000
    min_contig_len: 5000
    bwa_options: "-5SP"
    samtools_filter: "-F 0x900"
    sort_memory: 1G
    metacc_min_mapq: 30
    metacc_min_len: 1000
    metacc_min_match: 30
    metacc_min_signal: 2
    bin3c_min_mapq: 60
    bin3c_min_len: 1000
    bin3c_min_match: 10
    bin3c_min_signal: 5
    yahs_resolutions: ""
    yahs_min_mapq: 10
    yahs_min_contig_len: 0
    yahs_rounds: 1
    yahs_no_contig_ec: false
    yahs_no_scaffold_ec: false
    yahs_no_mem_check: false
    yahs_extra_args: ""
    normcc_thres: 0.05
    heatmap_max_image: 5000
    skip_checkm2: false
    checkm2_db: null
    tmp_dir: null
    keep_temp: false

  mge:
    genomad_db: null
    genomad_splits: 8
    genomad_sensitivity: 4.2
    genomad_cleanup: true
    genomad_restart: false
    genomad_preset: default
    genomad_min_score: 0.7
    genomad_max_fdr: 0.1
    genomad_extra_args: ""
    association_filter: zscore
    zscore_threshold: 0.5
    fixed_contact_threshold: 0
    top_percent: 50
    min_raw_contacts: 2
    ccfind_terminal_fragment_size: 500
    ccfind_min_identity: 94
    ccfind_min_aligned_length: 50
    min_contact_strength: 0
    tmp_dir: null

  mge_alignment:
    samtools_filter: "-F 0x900"
    bwa_options: "-5SP"
    mapq: 30
    min_intra_dist: 10000
    min_match_len: 30
    sort_memory: 1G
    tmp_dir: null
    keep_sam: false
    skip_metrics: false

  mge_contact:
    method: normcc
    metacc_min_signal: 1
    metacc_min_len: 1000
    metacc_min_mapq: 30
    metacc_min_match: 30
    spurious_contact_percent: 5
    coverage_file: null
    epsilon: 1
    max_iter: 1000
    tol: 1e-6
